server:
  port: 8080

spring:
  application:
    name: lab-reservation-repair-system
  datasource:
    url: jdbc:h2:mem:labres;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: "lab-reservation-repair-system-demo-secret-key-please-change-2026"
    expiration: 86400000
